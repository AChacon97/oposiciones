plugins {
    id "com.android.application"
    id 'com.google.gms.google-services' // Para FlutterFire (si lo usas)
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.appoposiciones"  // Cambia esto a tu propio namespace

    // Aquí estamos usando la versión del SDK recomendada por Flutter
    compileSdk = flutter.compileSdkVersion  // Delega la configuración a Flutter

    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.appoposiciones"  // Cambia esto a tu propio ID de aplicación
        minSdkVersion 23  // La mínima versión del SDK que tu aplicación soporta
        targetSdkVersion 33  // La versión del SDK objetivo para la aplicación (asegúrate de tenerlo actualizado)
        versionCode flutter.versionCode.toInteger()
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            shrinkResources false
            minifyEnabled false
        }
    }
}

flutter {
    source = "../.."
}
