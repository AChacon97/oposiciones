buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Asegúrate de que esta versión de AGP sea compatible con Flutter
        classpath 'com.android.tools.build:gradle:7.0.4'  // Asegúrate de que esta sea la versión compatible con tu configuración de Flutter
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.5.21'  // Verifica que esta versión de Kotlin esté actualizada
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
